<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Taskly Assignment Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout concept: top bar with three real pages (Board, Courses, Archive). Board puts "Due now" as a full-width band over three columns, then priority subjects beside a tests and exams calendar. */
:root {
  --bg: #FBFAF8;
  --surface: #FFFFFF;
  --sunken: #F0EEE9;
  --line: #E7E4DE;
  --line-strong: #D9D6CF;
  --ink: #1B1B1F;
  --ink-2: #3D3C39;
  --muted: #6B6A66;
  --ring: #8A8984;
  --btn-bg: #1F2A44;
  --btn-fg: #FBFAF8;
  --focus: #3B5BA9;
  --danger: #B3261E;
  --danger-bg: #F8E6E3;
  --danger-line: #E9C4BF;
  --danger-ink: #8F1D17;
  --sec-now: #B3261E;
  --sec-soon: #A67C2D;
  --sec-week: #3B5BA9;
  --sec-later: #8A8984;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --sans: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171614; --surface: #201F1C; --sunken: #2A2825; --line: #33312D; --line-strong: #47443F;
    --ink: #F2EFE9; --ink-2: #D3CFC7; --muted: #A39E95; --ring: #8B867D;
    --btn-bg: #ECE8DF; --btn-fg: #171614; --focus: #8FB0F5;
    --danger: #F28B82; --danger-bg: #3A1F1C; --danger-line: #5C312D; --danger-ink: #F6BDB7;
    --sec-now: #F28B82; --sec-soon: #D9AE55; --sec-week: #8FB0F5; --sec-later: #9A958C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171614; --surface: #201F1C; --sunken: #2A2825; --line: #33312D; --line-strong: #47443F;
  --ink: #F2EFE9; --ink-2: #D3CFC7; --muted: #A39E95; --ring: #8B867D;
  --btn-bg: #ECE8DF; --btn-fg: #171614; --focus: #8FB0F5;
  --danger: #F28B82; --danger-bg: #3A1F1C; --danger-line: #5C312D; --danger-ink: #F6BDB7;
  --sec-now: #F28B82; --sec-soon: #D9AE55; --sec-week: #8FB0F5; --sec-later: #9A958C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: clamp(0px, 3vw, 32px); }

.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.display { font-family: var(--serif); font-weight: 400; font-size: clamp(38px, 6vw, 60px); line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; }
.h2 { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.15; letter-spacing: -0.015em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* top bar */
.top { border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; min-height: 72px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 36px; height: 36px; border-radius: 10px; background: var(--btn-bg); display: flex; align-items: center; justify-content: center; }
.mark svg { stroke: var(--btn-fg); }
.brand-name { font-family: var(--serif); font-size: 24px; font-weight: 500; letter-spacing: -0.01em; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.nav a { padding: 10px 16px; border-radius: 999px; font-size: 14px; color: var(--muted); }
.nav a:hover { background: var(--sunken); }
.nav a[aria-current="page"] { background: var(--sunken); color: var(--ink); font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border: 1px solid var(--btn-bg); border-radius: 999px; background: var(--btn-bg); color: var(--btn-fg); font-size: 14px; font-weight: 600; }
.btn svg { stroke: var(--btn-fg); }
.btn:hover { opacity: 0.9; }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); font-weight: 500; }
.btn-ghost svg { stroke: var(--ink); }
.btn-danger { background: var(--danger-bg); color: var(--danger-ink); border-color: var(--danger-line); }
.icon-btn { flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 50%; background: none; }
.icon-btn:hover { background: var(--sunken); }
.icon-btn svg { stroke: var(--muted); }

main { padding-block: 48px 72px; }
main .wrap { display: flex; flex-direction: column; gap: 36px; }

/* hero */
.hero { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px 48px; }
.hero > div { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.progress { width: 280px; max-width: 100%; }
.bar-track { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar-fill { height: 100%; background: var(--btn-bg); }

.notice { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 14px 18px; border: 1px dashed var(--line-strong); border-radius: 12px; background: var(--sunken); }

/* panels and forms */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; }
.formrow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 150px; min-width: 0; }
.field.wide { flex: 2 1 240px; }
.field label, .field .eyebrow { display: block; }
.input { width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--bg); font-size: 15px; }
.err { color: var(--danger); font-size: 13px; }
.swatches { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.swatches legend { padding: 0 0 6px; }
.sw { position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; cursor: pointer; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sw .dot { width: 24px; height: 24px; border-radius: 50%; }
.sw input:checked + .dot { outline: 2px solid var(--ink); outline-offset: 3px; }
.sw input:focus-visible + .dot { outline: 2px solid var(--focus); outline-offset: 3px; }

/* toolbar */
.toolbar { display: flex; flex-direction: column; gap: 14px; }
.toolrow { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.search { position: relative; flex: 1 1 260px; max-width: 440px; }
.search svg { position: absolute; left: 14px; top: 14px; stroke: var(--muted); }
.search .input { padding-left: 40px; border-radius: 999px; background: var(--surface); }
.switch { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 4px; border: none; background: none; font-size: 14px; font-weight: 500; }
.switch .track { display: inline-flex; align-items: center; width: 36px; height: 22px; padding: 2px; border-radius: 999px; background: var(--line-strong); }
.switch .knob { width: 18px; height: 18px; border-radius: 50%; background: var(--surface); transition: transform 0.15s; }
.switch[aria-pressed="true"] .track { background: var(--btn-bg); }
.switch[aria-pressed="true"] .knob { transform: translateX(14px); }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg); }
.cdot { flex: none; width: 8px; height: 8px; border-radius: 50%; }

/* sections */
.board { display: flex; flex-wrap: wrap; gap: 48px 40px; align-items: flex-start; }
.sec { flex: 1 1 300px; min-width: 0; }
.sec.full { flex-basis: 100%; }
.sec-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.sec-head .count { margin-left: auto; }
.sec-dot { flex: none; align-self: center; width: 9px; height: 9px; border-radius: 50%; }
.cards { display: flex; flex-direction: column; gap: 12px; padding-top: 16px; }
.sec.full .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); }
.card { display: flex; align-items: stretch; gap: 12px; padding: 14px 8px 14px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.bar { flex: none; width: 4px; border-radius: 2px; }
.check { flex: none; width: 44px; height: 44px; margin: -6px -6px -6px -4px; padding: 0; border: none; background: none; display: flex; align-items: center; justify-content: center; }
.ring { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--ring); display: flex; align-items: center; justify-content: center; }
.ring svg { stroke: var(--btn-fg); opacity: 0; }
.check[aria-pressed="true"] .ring { background: var(--btn-bg); border-color: var(--btn-bg); }
.check[aria-pressed="true"] .ring svg { opacity: 1; }
.cbody { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
.ctitle { font-size: 16px; line-height: 22px; font-weight: 600; overflow-wrap: anywhere; }
.card.done .ctitle { color: var(--muted); text-decoration: line-through; font-weight: 500; }
.card.done .bar { opacity: 0.4; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line-strong); font-size: 12px; font-weight: 500; color: var(--ink-2); }
.due { font-size: 13px; color: var(--muted); }
.due.hot { color: var(--danger); font-weight: 600; }
.more { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 500; }
.more svg { stroke: var(--ink); }
.more[aria-expanded="true"] svg { transform: rotate(180deg); }
.empty { grid-column: 1 / -1; padding: 22px 20px; border: 1px dashed var(--line-strong); border-radius: 12px; text-align: center; }
.empty .serif { font-family: var(--serif); font-size: 20px; }

/* lower band */
.lower { display: flex; flex-wrap: wrap; gap: 48px 40px; align-items: flex-start; padding-top: 28px; border-top: 1px solid var(--line); }
.lower .a { flex: 1 1 400px; min-width: 0; }
.lower .b { flex: 1.25 1 480px; min-width: 0; }
.pcard { display: flex; align-items: stretch; gap: 16px; padding: 18px 20px 18px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.prow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pname { font-family: var(--serif); font-weight: 500; font-size: 24px; letter-spacing: -0.01em; }
.ptag { padding: 2px 10px; border-radius: 999px; background: var(--danger-bg); border: 1px solid var(--danger-line); font-size: 12px; font-weight: 600; color: var(--danger-ink); }
.pbody { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1; }
.nextline { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.nextline svg { flex: none; stroke: var(--ink); }
.cal-wrap { display: flex; flex-wrap: wrap; gap: 24px; padding-top: 16px; }
.cal { flex: 1 1 280px; min-width: 0; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; align-self: flex-start; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-title { font-family: var(--serif); font-size: 22px; letter-spacing: -0.01em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
.cal-grid .wd { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: var(--muted); padding-bottom: 6px; }
.cal-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 46px; }
.cal-num { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--ink-2); border-radius: 50%; }
.cal-num.has { font-weight: 600; color: var(--ink); }
.cal-num.today { background: var(--btn-bg); color: var(--btn-fg); font-weight: 600; }
.cal-pip { width: 5px; height: 5px; border-radius: 50%; }
.exams { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.exam { display: flex; align-items: center; gap: 14px; padding: 12px 8px 12px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.dateblock { flex: none; width: 48px; display: flex; flex-direction: column; align-items: center; padding: 6px 0; border-radius: 8px; background: var(--sunken); }
.dnum { font-family: var(--serif); font-size: 22px; line-height: 24px; }
.dmon { font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.ebody { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.etitle { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.eside { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.kind { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line-strong); background: var(--sunken); color: var(--ink-2); }
.kind.exam { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg); }

/* courses and archive pages */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.page-head > div { display: flex; flex-direction: column; gap: 10px; }
.ccards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 16px; }
.ccard { display: flex; flex-direction: column; gap: 16px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.ccard-top { display: flex; align-items: center; gap: 12px; }
.cswatch { flex: none; width: 14px; height: 14px; border-radius: 50%; }
.cname { font-family: var(--serif); font-size: 26px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.cstats { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.cactions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: auto; }
.confirm { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--danger-bg); border: 1px solid var(--danger-line); color: var(--danger-ink); font-size: 14px; }
.arow { display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; flex-wrap: wrap; }
.arow .cbody { flex: 1 1 220px; }
.arow .ctitle { color: var(--muted); text-decoration: line-through; font-weight: 500; }
.alist { display: flex; flex-direction: column; gap: 10px; }

footer { border-top: 1px solid var(--line); padding-block: 20px; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: 13px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .switch .knob { transition: none; } }
</style>

<header class="top gut">
  <div class="wrap">

  </div>
</footer>

        var ex = nextExam(c.id);
        h += '<li class="ccard"><div class="ccard-top"><span class="cswatch" style="background:' + safeColor(c.color) + '"></span><h2 class="cname">' + esc(c.name) + '</h2></div>' +
          '<div class="cstats"><span>' + plural(open, 'open assignment', 'open assignments') + '</span><span>' + (ex ? 'Next: ' + ex.kind.toLowerCase() + ' on ' + shortDate(ex.date) : 'No test or exam coming up') + '</span></div>';
        if (ui.confirmCourse === c.id) {
          h += '<div class="confirm" role="alert"><p>Remove ' + esc(c.name) + ' with its ' + plural(items.length, 'assignment', 'assignments') + ' and ' + plural(exams, 'test or exam', 'tests and exams') + '? This cannot be undone.</p>' +
            '<div class="cactions"><button type="button" class="btn" data-action="course-confirm" data-id="' + c.id + '">Remove course</button><button type="button" class="btn btn-ghost" data-action="course-keep">Keep it</button></div></div>';
        } else {
          h += '<div class="cactions"><button type="button" class="btn btn-ghost" data-action="course-remove" data-id="' + c.id + '" aria-label="Remove ' + esc(c.name) + '">Remove</button></div>';
        }
        h += '</li>';
      });
      h += '</ul>';
    }
    return h;
  }

  function archiveHTML() {
    var done = S.assignments.filter(function (a) { return a.done; }).sort(function (a, b) { return byDue(b, a); });
    var h = '<section class="page-head"><div><p class="eyebrow">Finished work</p><h1 class="display">Archive</h1></div>';
    if (done.length) {
      if (ui.confirmClear) {
        h += '<div class="confirm" role="alert"><p>Delete all ' + done.length + ' completed assignments? This cannot be undone.</p><div class="cactions"><button type="button" class="btn" data-action="clear-done-confirm">Delete them</button><button type="button" class="btn btn-ghost" data-action="clear-done-cancel">Keep them</button></div></div>';
      } else {
        h += '<button type="button" class="btn btn-ghost" data-action="clear-done-ask">Clear all completed</button>';
      }
    }
    h += '</section>';
    if (!done.length) {
      return h + '<div style="border:1px dashed var(--line-strong);border-radius:12px;padding:32px 20px;text-align:center"><p style="font-family:var(--serif);font-size:22px">Nothing archived yet</p><p class="muted small" style="margin-top:4px">Assignments you tick off on the Board are kept here, and you can restore any of them.</p></div>';
    }
    h += '<ul class="alist">';
    done.forEach(function (a) {
      h += '<li class="arow"><span class="bar" style="background:' + cColor(a.courseId) + ';align-self:stretch"></span><div class="cbody"><p class="ctitle">' + esc(a.title) + '</p><div class="meta"><span class="tag"><span class="cdot" style="background:' + cColor(a.courseId) + '"></span>' + esc(cName(a.courseId)) + '</span><span class="due">Due ' + esc(shortDate(a.date)) + '</span></div></div>' +
        '<button type="button" class="btn btn-ghost" style="height:36px;padding:0 14px;font-size:13px" data-action="toggle" data-id="' + a.id + '">Restore</button>' +
        '<button type="button" class="icon-btn" data-action="delete" data-id="' + a.id + '" aria-label="Delete ' + esc(a.title) + '">' + I.x + '</button></li>';
    });
    return h + '</ul>';
  }

  /* ---------- theme ---------- */
  function systemDark() { try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; } }
  function isDark() { return S.theme === 'dark' || S.theme === 'light' ? S.theme === 'dark' : systemDark(); }
  function applyTheme() {
    var root = document.documentElement;
    if (S.theme === 'dark' || S.theme === 'light') root.setAttribute('data-theme', S.theme);
    else root.removeAttribute('data-theme');
    var b = document.getElementById('theme-toggle');
    if (b) b.setAttribute('aria-pressed', isDark() ? 'true' : 'false');
  }

  /* ---------- render ---------- */
  function keepFocus(fn) {
    var a = document.activeElement, k = null;
    if (a && a.getAttribute && a.getAttribute('data-action')) {
      k = { act: a.getAttribute('data-action'), id: a.getAttribute('data-id'), v: a.getAttribute('data-v'), key: a.getAttribute('data-key') };
    } else if (a && a.id && a.id !== 'btn-add-top') {
      k = { el: a.id };
    }
    fn();
    if (!k) return;
    var sel = k.el ? '#' + k.el : '[data-action="' + k.act + '"]' + (k.id ? '[data-id="' + k.id + '"]' : '') + (k.v ? '[data-v="' + k.v + '"]' : '') + (k.key ? '[data-key="' + k.key + '"]' : '');
    var n = document.querySelector(sel);
    if (n && n.focus) n.focus();
  }

  function render() {
    applyTheme();
    var r = route();
    var links = document.querySelectorAll('[data-route]');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('data-route') === r) links[i].setAttribute('aria-current', 'page');
      else links[i].removeAttribute('aria-current');
    }
    keepFocus(function () {
      var v = document.getElementById('view');
      v.innerHTML = r === 'courses' ? coursesHTML() : (r === 'archive' ? archiveHTML() : boardHTML());
      if (r === 'board') renderLists();
    });
  }

  function focusId(id) { var n = document.getElementById(id); if (n) n.focus(); }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    var act = el.getAttribute('data-action'), id = el.getAttribute('data-id');
    var a;
    switch (act) {
      case 'nav-add':
        ui.adding = true;
        if (route() !== 'board') { location.hash = '#board'; }
        render(); focusId('f-title'); break;
      case 'add-close': ui.adding = false; render(); break;
      case 'toggle': a = findA(id); if (a) { a.done = !a.done; commit(); } break;
      case 'delete': S.assignments = S.assignments.filter(function (x) { return x.id !== id; }); commit(); break;
      case 'more': ui.expanded[el.getAttribute('data-key')] = !ui.expanded[el.getAttribute('data-key')]; keepFocus(renderLists); break;
      case 'chip': ui.chip = el.getAttribute('data-v'); render(); break;
      case 'theme-toggle': S.theme = isDark() ? 'light' : 'dark'; commit(); break;
      case 'hide-toggle': ui.hideDone = !ui.hideDone; render(); break;
      case 'cal-prev': ui.cal.m--; if (ui.cal.m < 0) { ui.cal.m = 11; ui.cal.y--; } keepFocus(renderLists); break;
      case 'cal-next': ui.cal.m++; if (ui.cal.m > 11) { ui.cal.m = 0; ui.cal.y++; } keepFocus(renderLists); break;
      case 'exam-open': ui.addExam = true; keepFocus(renderLists); focusId('x-date'); break;
      case 'exam-close': ui.addExam = false; keepFocus(renderLists); break;
      case 'exam-delete': S.exams = S.exams.filter(function (x) { return x.id !== id; }); commit(); break;
      case 'clear-examples': S.assignments = []; S.exams = []; S.seeded = false; commit(); break;
      case 'course-remove': ui.confirmCourse = id; render(); break;
      case 'course-keep': ui.confirmCourse = null; render(); break;
      case 'course-confirm':
        S.courses = S.courses.filter(function (c) { return c.id !== id; });
        S.assignments = S.assignments.filter(function (x) { return x.courseId !== id; });
        S.exams = S.exams.filter(function (x) { return x.courseId !== id; });
        if (ui.chip === id) ui.chip = 'all';
        ui.confirmCourse = null; commit(); break;
      case 'clear-done-ask': ui.confirmClear = true; render(); break;
      case 'clear-done-cancel': ui.confirmClear = false; render(); break;
      case 'clear-done-confirm': S.assignments = S.assignments.filter(function (x) { return !x.done; }); ui.confirmClear = false; commit(); break;
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'f-search') { ui.search = e.target.value; renderLists(); }
  });

  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!f || !f.id) return;
    e.preventDefault();
    var el = f.elements;
    if (f.id === 'form-add') {
      var title = el.title.value.trim();
      if (!title || !el.date.value) return;
      S.assignments.push({ id: uid(), title: title, courseId: el.course.value, date: el.date.value, time: el.time.value || '', done: false });
      ui.adding = false; commit();
    } else if (f.id === 'form-exam') {
      if (!el.date.value) return;
      S.exams.push({ id: uid(), courseId: el.course.value, kind: el.kind.value, date: el.date.value, time: el.time.value || '' });
      ui.addExam = false; commit();
    } else if (f.id === 'form-course') {
      var name = el.name.value.trim();
      if (!name) return;
      var dup = S.courses.some(function (c) { return c.name.toLowerCase() === name.toLowerCase(); });
      if (dup) { ui.courseError = 'You already have a course called ' + name + '.'; render(); focusId('c-name'); return; }
      var color = el.color.value || PALETTE[0].hex;
      ui.courseError = '';
      S.courses.push({ id: uid(), name: name, color: color });
      commit(); focusId('c-name');
    }
  });

  window.addEventListener('hashchange', function () { ui.confirmCourse = null; ui.confirmClear = false; ui.courseError = ''; render(); window.scrollTo(0, 0); });

  /* ---------- save on leave ---------- */
  function flush() {
    if (dbDoc && saveTimer) { clearTimeout(saveTimer); saveTimer = null; dbDoc.set(clone(S)).catch(function () {}); }
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });
  window.addEventListener('pagehide', flush);

  /* ---------- boot ---------- */
  S = normalize(loadLocal() || seed());
  saveLocal();
  render();
  initDb();
})();
</script>

</body></html>
